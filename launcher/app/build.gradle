plugins {
    id 'com.android.application'
}

// The home screen's sports and weather lines read one feed (README: "Sports and weather"). Its address is private, so it
// is never committed: tv.feedUrl in launcher/local.properties (gitignored). Empty or missing: the feature is off and
// the launcher stays fully offline.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def feedUrl = (localProps.getProperty('tv.feedUrl') ?: '').trim()

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
        resValue 'string', 'tv_feed_url', feedUrl
        // plain http only when the configured feed is http (a computer on the home network, for testing)
        manifestPlaceholders = [cleartext: feedUrl.startsWith('http://') ? 'true' : 'false']
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
}
