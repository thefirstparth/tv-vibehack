plugins {
    id 'com.android.application'
}

// The feed address and the personal days are built into :shared from launcher/local.properties (README: "Sports and
// weather"); here only whether the feed is plain http (a computer on the home network, for testing).
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def feedUrl = (localProps.getProperty('tv.feedUrl') ?: '').trim()
// The daily summary to the insights site (insights/, DiarySend): off unless both are set. The key is private.
def diaryUrl = (localProps.getProperty('tv.diaryUrl') ?: '').trim()
def diaryKey = (localProps.getProperty('tv.diaryKey') ?: '').trim()
// the build's commit, sent with each day so a slow day can be matched to the build that was on the TV
def commit = 'git rev-parse --short HEAD'.execute([], rootProject.projectDir).text.trim()
// built from uncommitted changes: "+" after the commit they started from, so a test build never passes for that commit
if (!'git status --porcelain -- app shared'.execute([], rootProject.projectDir).text.trim().isEmpty()) commit += '+'

android {
    namespace 'com.gathin.tvhome'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gathin.tvhome'
        minSdk 26
        targetSdk 29
        versionCode 2
        versionName '2.0'
        // plain http only when the configured feed is http (a computer on the home network, for testing)
        manifestPlaceholders = [cleartext: (feedUrl.startsWith('http://') || diaryUrl.startsWith('http://')) ? 'true' : 'false']
        resValue 'string', 'tv_diary_url', diaryUrl
        resValue 'string', 'tv_diary_key', diaryKey
        resValue 'string', 'tv_build', commit
    }

    buildTypes {
        // Release: shrunk (R8) and resources trimmed, not debuggable, and signed with the same key as the debug
        // builds (~/.android/debug.keystore) so pm install -r updates the installed launcher in place.
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
            crunchPngs false   // banner.png and ic_launcher.png are JPEG data; packed as they are, as in debug
        }
    }

    // targetSdk 29 is on purpose (a home screen for one TV, never on Play): release lint must not fail on it
    lint {
        disable 'ExpiredTargetSdkVersion'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':shared')
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    testImplementation 'junit:junit:4.13.2'   // unit tests on the computer only, not in the app
}
