<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Insights</title>
<meta name="description" content="What the living-room TV did each day: hours on, apps, home-screen speed.">
<meta name="theme-color" content="#0e1116">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
  :root { --bg: #0e1116; --card: #171b22; --line: #262c36; --text: #e8ebf0; --dim: #8a93a3; --accent: #7cc4ff; --warm: #ffb36b; --bad: #ff7a7a; --good: #7be0a6; }
  :root[data-theme="light"] { --bg: #f5f6f8; --card: #fff; --line: #e3e6eb; --text: #14181f; --dim: #5d6675; --accent: #1f77c9; --warm: #c46a12; --bad: #c43a3a; --good: #1d8a4f; }
  @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #f5f6f8; --card: #fff; --line: #e3e6eb; --text: #14181f; --dim: #5d6675; --accent: #1f77c9; --warm: #c46a12; --bad: #c43a3a; --good: #1d8a4f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-variant-numeric: tabular-nums; }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px calc(80px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; margin: 8px 0 2px; }
  .sub { color: var(--dim); font-size: 14px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 0 0 10px; font-weight: 600; }
  .big { font-size: 34px; font-weight: 650; letter-spacing: -.01em; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row span:last-child { color: var(--dim); text-align: right; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat b { display: block; font-size: 20px; }
  .stat small { color: var(--dim); font-size: 12px; }
  .bar { height: 8px; border-radius: 4px; background: var(--accent); margin-top: 4px; }
  .app { padding: 6px 0; }
  .app div:first-child { display: flex; justify-content: space-between; }
  .app span:last-child { color: var(--dim); }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 120px; margin-top: 6px; }
  .chart div { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; font-size: 11px; color: var(--dim); }
  .chart i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 2px; }
  .note { color: var(--dim); font-size: 13px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 4px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom)); background: var(--card); border-top: 1px solid var(--line); }
  nav[hidden] { display: none; }
  nav button { flex: 1; max-width: 150px; border: 0; background: none; color: var(--dim); font: inherit; font-size: 14px; padding: 10px 4px; border-radius: 10px; }
  nav button[aria-current="page"] { color: var(--text); background: var(--line); }
  form { display: flex; flex-direction: column; gap: 10px; margin-top: 30vh; }
  input, form button { font: inherit; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
  form button { background: var(--accent); color: #fff; border: 0; font-weight: 600; }
  .bad { color: var(--bad); } .good { color: var(--good); } .warm { color: var(--warm); }
  .empty { margin-top: 30vh; text-align: center; color: var(--dim); }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading…</p></main>
<nav id="nav" hidden>
  <button data-view="day">Day</button><button data-view="week">Week</button><button data-view="month">Month</button><button data-view="speed">Speed</button>
</nav>
<script type="module" src="/app.js"></script>
</body>
</html>
